
name: Oramachi AI Check

on:
  pull_request:
    branches:
      - ai-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('JSON valid')"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Build if available
        run: |
          node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)" \
            && npm run build \
            || {
              result=$?
              if [ "$result" -ne 1 ]; then
                exit "$result"
              fi
              echo "Build script not available or build failed"
              exit 1
            }
