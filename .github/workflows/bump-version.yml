# 【これは何?】
# GitHubにファイルをアップ(push)すると、GitHubが自動で bump-version.js を実行し、
# index.html の「?v=◯◯」を最新の値に書き換えてくれる仕組み。
#
# 【なぜ必要?】
# 手元で node bump-version.js を実行するのを忘れると、古いバージョン番号のまま
# アップされ、ブラウザが古いファイルを使い続けてしまう(=更新が反映されない)。
# この仕組みがあれば、実行し忘れてもGitHub側が代わりにやってくれる。
#
# 【設定方法】
# このファイルをリポジトリに置くだけ。追加の設定は不要。
# ただし1度だけ、GitHubのリポジトリ画面で以下を確認してください:
#   Settings → Actions → General → Workflow permissions
#   → 「Read and write permissions」を選んで Save
# (GitHubがindex.htmlを書き換えて保存するために必要な権限です)

name: バージョン自動更新

on:
  push:
    branches: [main, master]
    paths:
      - 'app.js'
      - 'style.css'
      - 'index.html'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: バージョンを更新
        run: node bump-version.js

      - name: 変更があれば保存する
        run: |
          if git diff --quiet index.html; then
            echo "バージョンに変更はありませんでした"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "バージョンを自動更新 [skip ci]"
            git push
          fi

